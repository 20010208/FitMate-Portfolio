name: CI

on:
  push:
  pull_request:

# lint / test を読み取り専用で回すだけ。書き込み権限は一切与えない。
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Node tests
        run: npm test

      - name: AI security regression tests
        run: npm run test:ai
